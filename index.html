<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#1769e0" />
  <meta name="description" content="Trainingspläne und Trainingsverlauf für die Greving-Familie." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script id="cloudSdk" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
  <title>GrevingFit – dein Training</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="appMenu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand"><button class="brand-mark" id="profileMark" type="button" aria-label="Anmelden" title="Zum Anmelden">?</button><a class="brand-name" href="#home" aria-label="GrevingFit Startseite">GrevingFit<span class="brand-dot">.</span></a></div>
      <button class="icon-button" id="installBtn" hidden aria-label="App installieren" title="App installieren">↓</button>
      <button class="icon-button sync-btn" id="syncBtn" type="button" aria-label="Jetzt synchronisieren" title="Jetzt synchronisieren"><svg class="sync-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v3h3M4 13a8 8 0 0 0 14.9 3M20 19v-3h-3"/></svg><span class="cloud-check" id="cloudCheck" hidden aria-hidden="true">✓</span></button>
    </header>
    <nav class="menu-panel" id="appMenu" aria-label="Hauptnavigation" hidden>
      <a href="#home" data-route="home"><span class="menu-link-inner"><span>⌂</span>Heute</span></a>
      <a href="#plan" data-route="plan"><span class="menu-link-inner"><svg class="menu-icon shared-nav-icon" data-icon="lists" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Einheiten & Vorlagen</span></a>
      <a href="#catalog" data-route="catalog"><span class="menu-link-inner"><svg class="menu-icon shared-nav-icon" data-icon="catalog" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12a3 3 0 0 1 3 3v14H7a3 3 0 0 1-3-3V4Zm0 14a3 3 0 0 1 3-3h12M8 8h7M8 11h5"/></svg>Übungskatalog</span></a>
      <a href="#history" data-route="history"><span class="menu-link-inner"><svg class="menu-icon history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14h16M7 15l4-4 3 2 6-7"/></svg>Verlauf</span></a>
      <a href="#stats" data-route="stats"><span class="menu-link-inner"><svg class="menu-icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m15.4 15.4 4.4 4.4"/></svg>Auswertung</span></a>
      <a href="#settings" data-route="settings"><span class="menu-link-inner"><svg class="menu-icon shared-nav-icon" data-icon="settings" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h3m6 0h9M3 12h10m6 0h2M3 19h3m6 0h9"/><circle cx="9" cy="5" r="3"/><circle cx="16" cy="12" r="3"/><circle cx="9" cy="19" r="3"/></svg>Settings</span></a>
    </nav>
    <main id="app" class="page"></main>
  </div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
          let offeredWorker = null;
          const offerUpdate = worker => {
            if (!worker || !navigator.serviceWorker.controller || offeredWorker === worker) return;
            offeredWorker = worker;
            if (confirm('Eine neue Version der App ist verfügbar. Jetzt aktualisieren?')) worker.postMessage('skipWaiting');
          };
          offerUpdate(registration.waiting);
          registration.addEventListener('updatefound', () => {
            const worker = registration.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed') offerUpdate(worker);
            });
          });
          registration.update().catch(() => {});
        } catch (error) {
          console.warn('Service Worker konnte nicht registriert werden:', error);
        }
      });
    }
  </script>
</body>
</html>
