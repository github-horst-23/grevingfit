<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1769e0" />
  <meta name="description" content="Trainingspläne und Trainingsverlauf für die Greving-Familie." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>GrevingFit – dein Training</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="appMenu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand"><button class="brand-mark" id="profileMark" type="button" aria-label="Anmelden" title="Zum Anmelden">?</button><a class="brand-name" href="#home" aria-label="GrevingFit Startseite">GrevingFit<span class="brand-dot">.</span></a></div>
      <button class="icon-button sync-btn" id="syncBtn" type="button" aria-label="Jetzt synchronisieren" title="Jetzt synchronisieren"><svg class="sync-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v3h3M4 13a8 8 0 0 0 14.9 3M20 19v-3h-3"/></svg><span class="cloud-check" id="cloudCheck" hidden aria-hidden="true">✓</span></button>
      <button class="icon-button settings-btn" id="cloudBtn" type="button" aria-label="Settings öffnen" title="Settings öffnen"><svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.52a.5.5 0 0 0-.5-.43h-3.84a.5.5 0 0 0-.5.43l-.36 2.52c-.59.23-1.14.55-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.62 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.31-.07.63-.07.95s.02.63.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.49.39 1.04.71 1.63.94l.36 2.52a.5.5 0 0 0 .5.43h3.84a.5.5 0 0 0 .5-.43l.36-2.52c.59-.23 1.14-.55 1.63-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="icon-button" id="installBtn" hidden aria-label="App installieren" title="App installieren">↓</button>
    </header>
    <nav class="menu-panel" id="appMenu" aria-label="Hauptnavigation" hidden>
      <a href="#home" data-route="home"><span>⌂</span>Heute</a>
      <a href="#plan" data-route="plan"><span>▤</span>Einheiten & Vorlagen</a>
      <a href="#catalog" data-route="catalog"><span>＋</span>Übungskatalog</a>
      <a href="#music" data-route="music"><span>♫</span>Musik</a>
      <a href="#history" data-route="history"><span>◷</span>Verlauf</a>
      <a href="#stats" data-route="stats"><span>↗</span>Auswertung</a>
      <a href="#settings" data-route="settings"><span>⚙</span>Settings</a>
    </nav>
    <main id="app" class="page"></main>
  </div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
          registration.addEventListener('updatefound', () => {
            const worker = registration.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller && confirm('Eine neue Version der App ist verfügbar. Jetzt aktualisieren?')) {
                worker.postMessage('skipWaiting');
              }
            });
          });
          registration.update().catch(() => {});
        } catch (error) {
          console.warn('Service Worker konnte nicht registriert werden:', error);
        }
      });
    }
  </script>
</body>
</html>
