<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1769e0" />
  <meta name="description" content="Trainingspläne und Trainingsverlauf für die Greving-Familie." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>GrevingFit – dein Training</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="appMenu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand"><button class="brand-mark" id="profileMark" type="button" aria-label="Anmelden" title="Zum Anmelden">?</button><a class="brand-name" href="#home" aria-label="GrevingFit Startseite">GrevingFit<span class="brand-dot">.</span></a></div>
      <button class="icon-button" id="installBtn" hidden aria-label="App installieren" title="App installieren">↓</button>
      <button class="icon-button sync-btn" id="syncBtn" type="button" aria-label="Jetzt synchronisieren" title="Jetzt synchronisieren"><svg class="sync-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v3h3M4 13a8 8 0 0 0 14.9 3M20 19v-3h-3"/></svg><span class="cloud-check" id="cloudCheck" hidden aria-hidden="true">✓</span></button>
    </header>
    <nav class="menu-panel" id="appMenu" aria-label="Hauptnavigation" hidden>
      <a href="#home" data-route="home"><span>⌂</span>Heute</a>
      <a href="#plan" data-route="plan"><svg class="menu-icon template-list-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".8"/><circle cx="4" cy="12" r=".8"/><circle cx="4" cy="18" r=".8"/></svg>Einheiten & Vorlagen</a>
      <a href="#catalog" data-route="catalog"><svg class="menu-icon book-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.5 5.5 8 5 4 5v13c3.7-.1 6.3.4 8 1.5m0-13C13.5 5.5 16 5 20 5v13c-3.7-.1-6.3.4-8 1.5m0-13v13"/></svg>Übungskatalog</a>
      <a href="#history" data-route="history"><svg class="menu-icon history-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14h16M7 15l4-4 3 2 6-7"/></svg>Verlauf</a>
      <a href="#stats" data-route="stats"><svg class="menu-icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m15.4 15.4 4.4 4.4"/></svg>Auswertung</a>
      <a href="#settings" data-route="settings"><svg class="menu-icon menu-settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
  <circle cx="12" cy="12" r="3" /></svg>Settings</a>
    </nav>
    <main id="app" class="page"></main>
  </div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
          let offeredWorker = null;
          const offerUpdate = worker => {
            if (!worker || !navigator.serviceWorker.controller || offeredWorker === worker) return;
            offeredWorker = worker;
            if (confirm('Eine neue Version der App ist verfügbar. Jetzt aktualisieren?')) worker.postMessage('skipWaiting');
          };
          offerUpdate(registration.waiting);
          registration.addEventListener('updatefound', () => {
            const worker = registration.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed') offerUpdate(worker);
            });
          });
          registration.update().catch(() => {});
        } catch (error) {
          console.warn('Service Worker konnte nicht registriert werden:', error);
        }
      });
    }
  </script>
</body>
</html>
