<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1769e0" />
  <meta name="description" content="Trainingspläne und Trainingsverlauf für die Greving-Familie." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>GrevingFit – dein Training</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="appMenu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand"><button class="brand-mark" id="profileMark" type="button" aria-label="Anmelden" title="Zum Anmelden">?</button><a class="brand-name" href="#home" aria-label="GrevingFit Startseite">GrevingFit<span class="brand-dot">.</span></a></div>
      <button class="icon-button cloud-btn" id="cloudBtn" type="button" aria-label="Cloud-Synchronisierung einrichten" title="Cloud-Synchronisierung einrichten"><svg class="cloud-icon settings-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.6 2.8-.2-.1a1.7 1.7 0 0 0-1.8.2l-.2.1h-3.2l-.1-.2a1.7 1.7 0 0 0-1.6-1l-.2.1-2.8-1.6.1-.2a1.7 1.7 0 0 0-.2-1.8l-.1-.2v-3.2l.2-.1a1.7 1.7 0 0 0 1-1.6l-.1-.2 1.6-2.8.2.1a1.7 1.7 0 0 0 1.8-.2l.2-.1h3.2l.1.2a1.7 1.7 0 0 0 1.6 1l.2-.1 2.8 1.6-.1.2a1.7 1.7 0 0 0 .2 1.8l.1.2v3.2z" transform="translate(-1.5 -1.5)"/></svg><span class="cloud-check" id="cloudCheck" hidden aria-hidden="true">✓</span></button>
      <button class="icon-button" id="installBtn" hidden aria-label="App installieren" title="App installieren">↓</button>
    </header>
    <nav class="menu-panel" id="appMenu" aria-label="Hauptnavigation" hidden>
      <a href="#home" data-route="home"><span>⌂</span>Heute</a>
      <a href="#plan" data-route="plan"><span>▤</span>Einheiten & Vorlagen</a>
      <a href="#catalog" data-route="catalog"><span>＋</span>Übungskatalog</a>
      <a href="#music" data-route="music"><span>♫</span>Musik</a>
      <a href="#history" data-route="history"><span>◷</span>Verlauf</a>
      <a href="#stats" data-route="stats"><span>↗</span>Auswertung</a>
      <a href="#settings" data-route="settings"><span>⚙</span>Settings</a>
    </nav>
    <main id="app" class="page"></main>
  </div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
          registration.addEventListener('updatefound', () => {
            const worker = registration.installing;
            if (!worker) return;
            worker.addEventListener('statechange', () => {
              if (worker.state === 'installed' && navigator.serviceWorker.controller && confirm('Eine neue Version der App ist verfügbar. Jetzt aktualisieren?')) {
                worker.postMessage('skipWaiting');
              }
            });
          });
          registration.update().catch(() => {});
        } catch (error) {
          console.warn('Service Worker konnte nicht registriert werden:', error);
        }
      });
    }
  </script>
</body>
</html>
